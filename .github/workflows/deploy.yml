name: Deploy SICKAS FARM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to server
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST is required" && exit 1)
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER is required" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "DEPLOY_PATH is required" && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is required" && exit 1)

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Sync files to server
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'storage/app/' \
            --exclude 'storage/framework/' \
            --exclude 'storage/logs/' \
            --exclude 'public/storage' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Run Laravel production commands
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION || 'mysql' }}
          DB_HOST: ${{ secrets.DB_HOST || '127.0.0.1' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SICKAS_ADMIN_NAME: ${{ secrets.SICKAS_ADMIN_NAME || 'Admin SICKAS FARM' }}
          SICKAS_ADMIN_EMAIL: ${{ secrets.SICKAS_ADMIN_EMAIL }}
          SICKAS_ADMIN_PASSWORD: ${{ secrets.SICKAS_ADMIN_PASSWORD }}
        run: |
          if [ ! -f .env.deploy ]; then
            if [ -n "$APP_URL" ] && [ -n "$DB_DATABASE" ] && [ -n "$DB_USERNAME" ] && [ -n "$DB_PASSWORD" ]; then
              cat > .env.deploy <<EOF
          APP_NAME="SICKAS FARM"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=$APP_URL
          APP_LOCALE=id
          APP_FALLBACK_LOCALE=id
          APP_FAKER_LOCALE=id_ID
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=daily
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=warning
          DB_CONNECTION=$DB_CONNECTION
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_DATABASE=$DB_DATABASE
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          SESSION_SECURE_COOKIE=true
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=public
          FILESYSTEM_PUBLIC_URL=/storage
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          CACHE_PREFIX=sickas_farm_cache
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS="$SICKAS_ADMIN_EMAIL"
          MAIL_FROM_NAME="\${APP_NAME}"
          VITE_APP_NAME="\${APP_NAME}"
          SICKAS_ADMIN_NAME="$SICKAS_ADMIN_NAME"
          SICKAS_ADMIN_EMAIL=$SICKAS_ADMIN_EMAIL
          SICKAS_ADMIN_PASSWORD=$SICKAS_ADMIN_PASSWORD
          EOF
              scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" .env.deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.deploy"
            fi
          fi

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
            if [ ! -f .env ] && [ -f .env.deploy ]; then mv .env.deploy .env; fi && \
            if [ ! -f .env ]; then echo 'Files synced. Create .env on the server or set APP_URL, DB_DATABASE, DB_USERNAME, and DB_PASSWORD secrets, then rerun this workflow.'; exit 0; fi && \
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache && \
            php artisan config:clear && \
            php artisan route:clear && \
            php artisan view:clear && \
            if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi && \
            php artisan migrate --force && \
            php artisan db:seed --class=ProductionSeeder --force && \
            php artisan storage:link --force || true && \
            php artisan optimize:clear && \
            php artisan config:cache && \
            php artisan route:cache && \
            php artisan view:cache && \
            php artisan filament:optimize"

      - name: Deployment summary
        run: |
          echo "Deployment workflow finished for $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
